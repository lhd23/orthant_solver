[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-orthant-transport"
version = "0.1.0"
description = "Gaussian probabilities by boundary-master reduction and BootLoops transport"
requires-python = ">=3.9"
dependencies = ["mpmath>=1.2", "sympy>=1.12"]

[project.optional-dependencies]
fast = ["python-flint>=0.8"]
test = ["numpy>=1.24", "scipy>=1.10", "pytest>=7"]

[tool.setuptools.packages.find]
include = ["gaussian_orthant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["major_change: Botev and SciPy regression campaign to run after major solver changes"]
